# security-monitoring 전용 ServiceAccount (CLIAR-252)
#
# 여기(base)에는 eks.amazonaws.com/role-arn 어노테이션을 두지 않는다.
# CLIAR-252 시점에는 이 서비스가 AWS API를 호출하지 않으므로 IRSA 롤이
# 아직 없다 — 실제 롤 ARN을 추측해서 넣지 않는다(backend-auth의
# serviceaccount-patch.yaml 패턴 참고). 향후 AWS 리소스(예: GuardDuty
# Finding 조회 등)를 호출하는 provider가 추가되면, 그때 실제 롤을
# 생성한 뒤 overlay에 serviceaccount-patch.yaml로 주입한다.
#
# 어노테이션이 없는 상태의 이 SA는 default SA와 자격증명 동작이
# 동일하다(노드 롤 사용). 이 파일만 적용하는 것은 무해하다.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: security-monitoring
  labels:
    app.kubernetes.io/name: security-monitoring
