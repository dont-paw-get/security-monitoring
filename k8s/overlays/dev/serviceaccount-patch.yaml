# dev 환경 security-monitoring SA 에 IRSA 롤 ARN 을 주입합니다. (CLIAR-260)
#
# 이 롤은 GuardDuty SQS Consumer(app/providers/sqs.py)만을 위한 것이며
# sqs:ReceiveMessage / sqs:DeleteMessage / sqs:GetQueueAttributes /
# sqs:GetQueueUrl 4개 액션만 가집니다. 정책은 dpyb-security-monitoring-guardduty-dev
# 큐 하나로 스코핑돼 있습니다(SendMessage/PurgeQueue/DeleteQueue/
# SetQueueAttributes 없음, wildcard Resource 없음).
#   role  : dpyb-security-monitoring-irsa-dev
#   trust : system:serviceaccount:dpyb-security-monitoring-dev:security-monitoring
#
# base(k8s/base/serviceaccount.yaml)에는 이 어노테이션을 두지 않는다 —
# prod overlay가 base를 그대로 상속하므로, 여기 dev overlay에서만
# patch로 주입해야 prod로 새어들지 않는다(backend-auth의 dev/prod
# serviceaccount-patch.yaml 분리 패턴과 동일).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: security-monitoring
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::594532711953:role/dpyb-security-monitoring-irsa-dev
