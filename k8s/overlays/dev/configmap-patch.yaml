# 개발 환경에서 base ConfigMap 위에 덮어쓸 값
apiVersion: v1
kind: ConfigMap
metadata:
  name: security-monitoring-config
data:
  APP_ENV: "development"

  # ---- 관측 (app/core/observability.py) ----
  #
  # deployment.environment.name 은 Tempo/Loki 에서 dev·prod 텔레메트리를
  # 구분하는 표준 리소스 속성이다. service.name 은 base 의
  # OTEL_SERVICE_NAME("security-monitoring")에서 온다.
  OTEL_RESOURCE_ATTRIBUTES: "deployment.environment.name=dev"
  #
  # OpenTelemetry Collector (dpgy-infra 소유). 다른 MSA(backend-auth 등)와
  # 동일한 dev 클러스터 Service DNS를 사용한다. 이 값이 주입되는 순간
  # app/core/observability.py 가 TracerProvider + OTLP http/protobuf
  # exporter 를 켠다(값이 없으면 tracing 전체가 꺼진 채 동작).
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector.monitoring.svc.cluster.local:4318"
  #
  # 인프라 Collector 는 traces 파이프라인만 받는다(gRPC 4317 은 닫혀 있음).
  OTEL_EXPORTER_OTLP_PROTOCOL: "http/protobuf"
  OTEL_METRICS_EXPORTER: "none"
  OTEL_LOGS_EXPORTER: "none"
  #
  # dev 는 트레이스 검증이 목적이므로 전량 샘플링한다.
  OTEL_TRACES_SAMPLER: "parentbased_traceidratio"
  OTEL_TRACES_SAMPLER_ARG: "1.0"

  # ---- GuardDuty SQS Consumer (CLIAR-260, app/providers/sqs.py) ----
  #
  # ServiceAccount는 이 dev overlay의 serviceaccount-patch.yaml에서 IRSA
  # 롤(dpyb-security-monitoring-irsa-dev)을 부여받는다 — 이 Queue URL은
  # 비밀값이 아니지만 SQS 접근 자체는 그 IRSA 롤로만 인증된다(static
  # credential 없음).
  AWS_REGION: "ap-northeast-2"
  SQS_GUARDDUTY_QUEUE_URL: "https://sqs.ap-northeast-2.amazonaws.com/594532711953/dpyb-security-monitoring-guardduty-dev"
  # base 기본값(false)을 dev에서만 켠다 — prod overlay는 이 patch를
  # 상속하지 않으므로 여전히 false로 남는다.
  MONITORING_ENABLED: "true"

  # ---- GuardDuty Finding Bedrock AI 분석 (CLIAR-264, app/providers/bedrock.py) ----
  #
  # 위 serviceaccount-patch.yaml의 동일 IRSA 롤(dpyb-security-monitoring-irsa-dev)이
  # bedrock:InvokeModel / bedrock:GetInferenceProfile 권한도 가지고 있다
  # (해당 Inference Profile 하나로만 스코핑됨). 값 자체는 비밀이 아니다.
  BEDROCK_REGION: "ap-northeast-2"
  BEDROCK_MODEL_ID: "global.anthropic.claude-haiku-4-5-20251001-v1:0"

  # ---- Bedrock 분석 결과 SNS 관리자 알림 (CLIAR-268, app/providers/sns.py) ----
  #
  # 위 IRSA 롤이 이 Topic 하나에 대한 sns:Publish와, alias/aws/sns 실제
  # Key 하나에 대한 kms:GenerateDataKey*/kms:Decrypt만 가지고 있다. 값
  # 자체는 비밀이 아니다.
  SNS_ALERT_TOPIC_ARN: "arn:aws:sns:ap-northeast-2:594532711953:dpyb-security-monitoring-alerts-dev"
